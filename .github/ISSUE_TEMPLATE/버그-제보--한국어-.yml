name: "버그제보 [한국어]"
description: 버그사항을 찾으셨습니까? 아래 양식에 맞춰 버그리포트를 작성해주세요
title: "[BUG]"
labels: "Bug"
body:
  - type: markdown
	  attributes:
    	value: |
    		버그사항 접수해주셔서 감사합니다. 아래 양식에 맞춰 버그리포트를 작성해주세요.
  - type: textarea
  	attributes:
      label: 오류사항,기대결과
      description: 문제가 발생한 버그사항,버그가 없었다면 기대하는 결과를 설명해주세요. 필요시 스샷 첨부
    validations:
      required: true
	- type: textarea
  	attributes:
      label: 재현방법
      description: 버그를 재현할 수 있는 방법을 알려주세요. 필요시 스샷 첨부
    validations:
      required: true
  - type: textarea
  	attributes:
      label: 추가사항
      description: 추가로 전달하고 싶은 사항이 있다면 작성해주세요.